<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TÜGVA Yaz Okulu Kayıt Sistemi</title>

<meta name="theme-color" content="#0b4ea2">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="page">
<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<img
src="images/logo.png"
class="logo"
alt="TÜGVA">

<h1>

TÜGVA Yaz Okulu

</h1>

<p>

Yaz Okulu Kayıt Sistemi

</p>

</div>

</header>
<section class="capacity">

<div class="capacity-card">

<h2>

Kontenjan

</h2>

<div class="capacity-number"

id="remainingCapacity">

500

</div>

<p>

Kalan kontenjan

</p>

</div>

</section>
<section class="register">

<div class="register-card">

<h2>

Kayıt Formu

</h2>

<form id="registerForm">

<div class="row">

<div class="col-md-6">

<label>

Ad Soyad

</label>

<input

id="name"

class="form-control"

required>

</div>

<div class="col-md-6">

<label>

T.C. Kimlik No

</label>

<input

id="tc"

maxlength="11"

class="form-control"

required>

</div>

</div>
<div class="row mt-3">

<div class="col-md-6">

<label>

Telefon

</label>

<input

id="phone"

class="form-control">

</div>

<div class="col-md-6">

<label>

E-Posta

</label>

<input

id="email"

class="form-control">

</div>

</div>

<div class="row mt-3">

<div class="col-md-6">

<label>

Doğum Tarihi

</label>

<input

type="date"

id="birth"

class="form-control">

</div>

<div class="col-md-6">

<label>

Cinsiyet

</label>

<select

id="gender"

class="form-select">

<option value="">

Seçiniz

</option>

<option>

Erkek

</option>

<option>

Kadın

</option>

</select>

</div>

</div>
<div class="row mt-3">

    <div class="col-md-6">

        <label>Okul</label>

        <input
            id="school"
            class="form-control"
            required>

    </div>

    <div class="col-md-6">

        <label>Sınıf</label>

        <select
            id="class"
            class="form-select"
            required>

            <option value="">Seçiniz</option>

            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>

        </select>

    </div>

</div>
<div class="row mt-3">

    <div class="col-md-6">

        <label>Veli Ad Soyad</label>

        <input
            id="parent"
            class="form-control"
            required>

    </div>

    <div class="col-md-6">

        <label>Veli Telefon</label>

        <input
            id="parentPhone"
            class="form-control"
            required>

    </div>

</div>
<div class="mt-3">

    <label>Adres</label>

    <textarea
        id="address"
        rows="3"
        class="form-control"></textarea>

</div>

<div class="mt-3">

    <label>Not</label>

    <textarea
        id="note"
        rows="3"
        class="form-control"></textarea>

</div>
<div class="form-check mt-4">

    <input
        class="form-check-input"
        type="checkbox"
        id="kvkk"
        required>

    <label
        class="form-check-label"
        for="kvkk">

        Kişisel verilerimin kayıt amacıyla işlenmesini kabul ediyorum.

    </label>

</div>
<div class="mt-4 d-grid">

    <button
        id="submitButton"
        class="btn btn-primary btn-lg"
        type="submit">

        Kaydı Tamamla

    </button>

</div>

<div
    id="loading"
    class="loading mt-3"
    style="display:none;">

    Kayıt oluşturuluyor...

</div>

</form>

</div>

</section>
<section
id="successSection"
class="success-section"
style="display:none;">

<div class="success-card">

<h2>

✅ Kayıt Başarıyla Oluşturuldu

</h2>

<p>

Kayıt bilgileriniz aşağıdadır.

</p>

<div id="qr"></div>

<div
id="registrationInfo">

</div>

<div class="mt-4 d-grid gap-2">

<button
id="downloadPdfButton"
class="btn btn-success">

PDF İndir

</button>

<button
id="againButton"
class="btn btn-outline-primary">

Yeni Kayıt

</button>

</div>

</div>

</section>
<!-- QR Kod Kütüphanesi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- PDF İndirme Kütüphanesi -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script
type="module"
src="js/app.js"></script>

</div>

</body>

</html>
