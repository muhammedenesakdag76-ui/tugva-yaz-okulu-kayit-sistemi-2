<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TÜGVA Yaz Okulu Kayıt</title>

<link
rel="stylesheet"
href="css/style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

<header class="hero">

<h1>TÜGVA Yaz Okulu</h1>

<p>

Online Kayıt Sistemi

</p>

</header>

<div class="capacity-card">

<div class="capacity-title">

Kalan Kontenjan

</div>

<div
class="capacity-number"
id="remainingCapacity">

45

</div>

</div>

<section
class="card"
id="formSection">

<h2>

Katılımcı Bilgileri

</h2>

<form
id="registerForm">

<div class="grid">

<div class="form-group">

<label>

Ad Soyad

</label>

<input
type="text"
id="adSoyad"
required>

</div>

<div class="form-group">

<label>

TC Kimlik No

</label>

<input
type="text"
id="tc"
maxlength="11"
required>

</div>

<div class="form-group">

<label>

Telefon

</label>

<input
type="text"
id="telefon"
maxlength="11"
required>

</div>

<div class="form-group">

<label>

E-Posta

</label>

<input
type="email"
id="email">

</div>
<div class="form-group">

<label>

Doğum Tarihi

</label>

<input
type="date"
id="dogumTarihi"
required>

</div>

<div class="form-group">

<label>

Cinsiyet

</label>

<select
id="cinsiyet"
required>

<option value="">

Seçiniz

</option>

<option>

Erkek

</option>

<option>

Kız

</option>

</select>

</div>

<div class="form-group">

<label>

Okul

</label>

<input
type="text"
id="okul"
required>

</div>

<div class="form-group">

<label>

Sınıf

</label>

<input
type="text"
id="sinif"
required>

</div>

<div class="form-group">

<label>

Veli Adı

</label>

<input
type="text"
id="veliAdi"
required>

</div>

<div class="form-group">

<label>

Veli Telefonu

</label>

<input
type="text"
id="veliTelefon"
maxlength="11"
required>

</div>

</div>

<div class="form-group">

<label>

Adres

</label>

<textarea

id="adres"

rows="3"

required>

</textarea>

</div>

<div class="form-group">

<label>

Not

</label>

<textarea

id="note"

rows="3">

</textarea>

</div>
<div class="checkbox-group">

<label class="checkbox">

<input
type="checkbox"
id="kvkk"
required>

<span>

KVKK kapsamında kişisel verilerin işlenmesini kabul ediyorum.

</span>

</label>

<label class="checkbox">

<input
type="checkbox"
id="parent"
required>

<span>

Veli/Vasi olarak kayıt onayını veriyorum.

</span>

</label>

</div>

<div class="button-area">

<button
type="submit"
class="btn btn-primary">

Kaydı Tamamla

</button>

</div>

</form>

</section>


<!-- ========================= -->
<!-- SUCCESS CARD -->
<!-- ========================= -->

<section

id="successCard"

class="card hidden">

<div class="success-icon">

✅

</div>

<h2>

Kayıt Başarıyla Tamamlandı

</h2>

<p>

Kayıt Numaranız

</p>

<h1

id="registerNumber">

TYG26-0001

</h1>

<div

id="qrcode"

class="qr-box">

</div>

<div class="button-group">

<button

id="downloadPdf"

class="btn btn-success">

PDF İndir

</button>

<button

id="newRegister"

class="btn btn-secondary">

Yeni Kayıt

</button>

</div>

</section>
<footer>

<p>

© 2026 TÜGVA Yaz Okulu

</p>

<p>

Online Kayıt Sistemi

</p>

</footer>

</div>

<!-- ========================= -->
<!-- JAVASCRIPT -->
<!-- ========================= -->

<script

type="module"

src="js/app.js">

</script>
</body>

</html>
