<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Yönetici Girişi</title>

<link
rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<section
class="card"
style="max-width:450px;margin:80px auto;">

<h2
style="text-align:center;">

Yönetici Girişi

</h2>

<form
id="loginForm">

<div class="form-group">

<label>

E-Posta

</label>

<input

type="email"

id="email"

required>

</div>

<div class="form-group">

<label>

Şifre

</label>

<input

type="password"

id="password"

required>

</div>

<button

class="btn btn-primary"

type="submit">

Giriş Yap

</button>

</form>

</section>

</div>

<script
type="module"
src="js/login.js">

</script>

</body>

</html>
