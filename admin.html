<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Yönetici Paneli | TÜGVA İstanbul Final Gezisi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="admin.css">

</head>

<body>

<div id="loading">

<div class="loader"></div>

<h2>Yükleniyor...</h2>

</div>

<section id="loginPage">

<div class="loginCard">

<div class="loginLogo">

<i class="fa-solid fa-user-shield"></i>

</div>

<h1>Yönetici Girişi</h1>

<p>Firebase Authentication ile giriş yapınız.</p>

<form id="loginForm">

<div class="input">

<label>E-Posta</label>

<input
type="email"
id="email"
required>

</div>

<div class="input">

<label>Şifre</label>

<input
type="password"
id="password"
required>

</div>

<button
type="submit"
class="primary">

<i class="fa-solid fa-right-to-bracket"></i>

Giriş Yap

</button>

</form>

</div>

</section>

<section id="adminPanel" class="hidden">

<header>

<div class="headerLeft">

<h1>

<i class="fa-solid fa-bus"></i>

İstanbul Final Gezisi

</h1>

</div>

<div class="headerRight">

<button
id="logoutButton"
class="danger">

<i class="fa-solid fa-right-from-bracket"></i>

Çıkış Yap

</button>

</div>

</header>

<main>

<div class="stats">

<div class="statCard">

<h2 id="totalCount">0</h2>

<span>Toplam Kayıt</span>

</div>

<div class="statCard">

<h2 id="adultCount">0</h2>

<span>18 Yaş Üstü</span>

</div>

<div class="statCard">

<h2 id="childCount">0</h2>

<span>18 Yaş Altı</span>

</div>

<div class="statCard">

<h2 id="assignedCount">0</h2>

<span>Koltuk Atanan</span>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Ad Soyad veya T.C. Ara...">

<select id="filterBus">

<option value="">Tüm Otobüsler</option>

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

<option>9</option>

<option>10</option>

</select>

<button
id="refreshButton"
class="secondary">

<i class="fa-solid fa-rotate"></i>

Yenile

</button>

</div>

<div class="tableContainer">

<table>

<thead>

<tr>

<th>Kayıt</th>

<th>Ad Soyad</th>

<th>T.C.</th>

<th>Telefon</th>

<th>Yaş</th>

<th>Otobüs</th>

<th>Koltuk</th>

<th>İşlemler</th>

</tr>

</thead>

<tbody id="participantTable">

</tbody>

</table>

</div>

</main>

</section>

<div id="editModal" class="modal hidden">

<div class="modalContent">

<h2>

Katılımcıyı Düzenle

</h2>

<input
type="hidden"
id="editId">

<div class="grid">

<div class="input">

<label>Otobüs No</label>

<select id="editBus">

<option value="">Seçiniz</option>

<option>1</option>

<option>2</option>

<option>3</option>

<option>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

<option>9</option>

<option>10</option>

</select>

</div>

<div class="input">

<label>Koltuk No</label>

<input
type="number"
id="editSeat"
min="1"
max="60">

</div>

</div>

<div class="modalButtons">

<button
id="saveButton"
class="primary">

<i class="fa-solid fa-floppy-disk"></i>

Kaydet

</button>

<button
id="cancelButton"
class="secondary">

İptal

</button>

</div>

</div>

</div>

<script type="module" src="firebase.js"></script>

<script type="module" src="admin.js"></script>

</body>

</html>
