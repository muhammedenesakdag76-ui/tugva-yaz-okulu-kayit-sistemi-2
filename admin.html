<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>TÜGVA Yaz Okulu Yönetim Paneli</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="css/admin.css">

</head>

<body class="bg-light">

<div class="container-fluid py-4">

<h2 class="mb-4">

Yönetici Paneli

</h2>

<div class="row g-3 mb-4">

<div class="col-lg-3">

<div class="card shadow-sm">

<div class="card-body">

<h6>Toplam Kayıt</h6>

<h2 id="totalRegistrations">0</h2>

</div>

</div>

</div>

<div class="col-lg-3">

<div class="card shadow-sm">

<div class="card-body">

<h6>Giriş Yapan</h6>

<h2 id="checkedInCount">0</h2>

</div>

</div>

</div>

<div class="col-lg-3">

<div class="card shadow-sm">

<div class="card-body">

<h6>Kalan Kontenjan</h6>

<h2 id="remainingCapacity">500</h2>

</div>

</div>

</div>

<div class="col-lg-3">

<div class="card shadow-sm">

<div class="card-body">

<h6>Koltuk Verilen</h6>

<h2 id="seatCount">0</h2>

</div>

</div>

</div>

</div>
<div class="card shadow-sm mb-4">

    <div class="card-body">

        <div class="row g-3 align-items-center">

            <div class="col-lg-4">

                <input
                    id="searchInput"
                    type="text"
                    class="form-control"
                    placeholder="İsim, Telefon, TC veya Kayıt No Ara">

            </div>

            <div class="col-lg-8 text-lg-end">

                <button
                    id="refreshButton"
                    class="btn btn-primary">

                    Yenile

                </button>

                <button
                    id="exportCsvButton"
                    class="btn btn-success">

                    CSV İndir

                </button>

                <button
                    id="printButton"
                    class="btn btn-secondary">

                    Yazdır

                </button>

                <button
                    id="startQrButton"
                    class="btn btn-dark">

                    Kamerayı Aç

                </button>

                <button
                    id="stopQrButton"
                    class="btn btn-outline-dark">

                    Kamerayı Kapat

                </button>

            </div>

        </div>

    </div>

</div>

<div class="card shadow-sm mb-4">

    <div class="card-header">

        <strong>QR Kod Okuyucu</strong>

    </div>

    <div class="card-body">

        <div
            id="qr-reader"
            style="
                width:100%;
                max-width:450px;
                margin:auto;
            ">
        </div>

    </div>

</div>
<div
    id="loading"
    class="text-center py-5"
    style="display:none;">

    <div
        class="spinner-border text-primary"
        role="status">

    </div>

    <div class="mt-3">

        Yükleniyor...

    </div>

</div>
<div class="card shadow-sm">

    <div class="card-header">

        <strong>Kayıt Listesi</strong>

    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table class="table table-hover table-bordered align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>Kayıt No</th>

                        <th>Ad Soyad</th>

                        <th>Telefon</th>

                        <th>Koltuk</th>

                        <th>Durum</th>

                        <th>QR Giriş</th>

                        <th>Sil</th>

                    </tr>

                </thead>

                <tbody id="registrationTableBody">

                    <tr>

                        <td colspan="7" class="text-center py-4">

                            Henüz kayıt bulunmuyor.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
<div class="position-fixed bottom-0 end-0 p-3"
     style="z-index:1080;">

    <div id="adminToast"
         class="toast"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">

        <div class="d-flex">

            <div class="toast-body">

                İşlem başarılı.

            </div>

            <button
                type="button"
                class="btn-close me-2 m-auto"
                data-bs-dismiss="toast">
            </button>

        </div>

    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script type="module" src="js/admin.js"></script>

</body>

</html>
