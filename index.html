<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TÜGVA Yaz Okulu Kayıt Sistemi</title>

    <meta name="theme-color"
          content="#0b4ea2">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<div class="page">

    <!-- HERO -->

    <header class="hero">

        <div class="overlay"></div>

        <div class="hero-content">

            <img
                src="images/logo.png"
                class="logo"
                alt="TÜGVA">

            <h1>
                TÜGVA Yaz Okulu
            </h1>

            <p>
                Yaz Okulu Kayıt Sistemi
            </p>

        </div>

    </header>

    <!-- KONTENJAN -->

    <section class="capacity">

        <div class="capacity-card">

            <h2>
                Kontenjan
            </h2>

            <div
                id="remainingCapacity"
                class="capacity-number">

                500

            </div>

            <p>
                Kalan Kontenjan
            </p>

            <div class="progress mt-3">

                <div
                    id="capacityBar"
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width:0%">

                </div>

            </div>

            <div
                id="remainingCapacityText"
                class="text-center mt-2">

                0 / 500

            </div>

        </div>

    </section>

    <!-- KAYIT FORMU -->

    <section class="register">

        <div class="register-card">

            <h2>

                Kayıt Formu

            </h2>

            <form id="registerForm">
                            <!-- Öğrenci Bilgileri -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Ad Soyad
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            autocomplete="name"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            T.C. Kimlik No
                        </label>

                        <input
                            type="text"
                            id="tc"
                            class="form-control"
                            maxlength="11"
                            autocomplete="off"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Telefon
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            maxlength="10"
                            placeholder="5XXXXXXXXX"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            E-Posta
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="ornek@mail.com">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Doğum Tarihi
                        </label>

                        <input
                            type="date"
                            id="birth"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cinsiyet
                        </label>

                        <select
                            id="gender"
                            class="form-select"
                            required>

                            <option value="">
                                Seçiniz
                            </option>

                            <option value="Erkek">
                                Erkek
                            </option>

                            <option value="Kadın">
                                Kadın
                            </option>

                        </select>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Okul
                        </label>

                        <input
                            type="text"
                            id="school"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Sınıf
                        </label>

                        <select
                            id="class"
                            class="form-select"
                            required>

                            <option value="">
                                Seçiniz
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                            <option>11</option>
                            <option>12</option>

                        </select>

                    </div>

                </div>

                <!-- Veli Bilgileri -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Veli Ad Soyad
                        </label>

                        <input
                            type="text"
                            id="parent"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Veli Telefon
                        </label>

                        <input
                            type="tel"
                            id="parentPhone"
                            class="form-control"
                            maxlength="10"
                            placeholder="5XXXXXXXXX"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Adres
                    </label>

                    <textarea
                        id="address"
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Not
                    </label>

                    <textarea
                        id="note"
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <div class="form-check mb-4">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="kvkk"
                        required>

                    <label
                        class="form-check-label"
                        for="kvkk">

                        Kişisel verilerimin kayıt amacıyla işlenmesini kabul ediyorum.

                    </label>

                </div>

                <div class="d-grid gap-2">

                    <button
                        id="submitButton"
                        type="submit"
                        class="btn btn-primary btn-lg">

                        Kaydı Tamamla

                    </button>

                    <button
                        id="resetButton"
                        type="reset"
                        class="btn btn-outline-secondary">

                        Formu Temizle

                    </button>

                </div>

                <div
                    id="loading"
                    class="loading mt-4"
                    style="display:none;">

                    Kayıt oluşturuluyor...

                </div>

            </form>

        </div>

    </section>
        <!-- BAŞARI EKRANI -->

    <section
        id="successSection"
        class="success-section"
        style="display:none;">

        <div class="success-card">

            <div class="success-icon">

                ✅

            </div>

            <h2>

                Kayıt Başarıyla Oluşturuldu

            </h2>

            <p class="text-muted">

                Kaydınız başarıyla tamamlandı.

            </p>

            <div class="register-number-box">

                <small>

                    Kayıt Numaranız

                </small>

                <h3 id="successRegisterNumber">

                    -

                </h3>

            </div>

            <div
                id="qr"
                class="qr-area">

            </div>

            <div
                id="registrationInfo"
                class="registration-info">

                <div class="info-row">

                    <span>

                        Ad Soyad

                    </span>

                    <strong id="successName">

                        -

                    </strong>

                </div>

                <div class="info-row">

                    <span>

                        Koltuk No

                    </span>

                    <strong id="successSeat">

                        Henüz atanmadı

                    </strong>

                </div>

            </div>

            <div class="d-grid gap-2 mt-4">

                <button
                    id="downloadPdfButton"
                    class="btn btn-success btn-lg">

                    📄 PDF İndir

                </button>

                <button
                    id="againButton"
                    class="btn btn-outline-primary btn-lg">

                    Yeni Kayıt

                </button>

            </div>

        </div>

    </section>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<script
    type="module"
    src="js/app.js">
</script>

</body>

</html>
