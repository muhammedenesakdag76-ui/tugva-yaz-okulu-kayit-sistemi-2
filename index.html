<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaz Okulu Kayıt Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <!-- Hero Banner -->
        <header class="hero">
            <div class="overlay"></div>
            <div class="hero-content">
                <img src="assets/logo.png" alt="Logo" class="logo">
                <h1>TÜGVA Yaz Okulu</h1>
                <p>Kayıt Başvuru Portalı</p>
            </div>
        </header>

        <!-- Kapasite Durumu -->
        <div class="capacity">
            <div class="capacity-card">
                <h3>Kalan Kontenjan</h3>
                <div class="capacity-number" id="capacityCount">--</div>
            </div>
        </div>

        <!-- Kayıt Formu Alanı -->
        <section class="register" id="registerSection">
            <div class="register-card">
                <h2>Öğrenci Kayıt Formu</h2>
                <form id="registrationForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">T.C. Kimlik No</label>
                            <input type="text" class="form-control" id="tc" maxlength="11" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ad Soyad</label>
                            <input type="text" class="form-control" id="adSoyad" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Telefon</label>
                            <input type="tel" class="form-control" id="telefon" placeholder="05XX..." required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Okul</label>
                            <input type="text" class="form-control" id="okul" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sınıf</label>
                            <select class="form-select" id="sinif" required>
                                <option value="">Seçiniz...</option>
                                <option value="5. Sınıf">5. Sınıf</option>
                                <option value="6. Sınıf">6. Sınıf</option>
                                <option value="7. Sınıf">7. Sınıf</option>
                                <option value="8. Sınıf">8. Sınıf</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Veli Ad Soyad</label>
                            <input type="text" class="form-control" id="veliAd" required>
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" id="submitBtn">Kayıt Ol</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- Başarı Ekranı ve QR Bölümü -->
        <section class="success-section d-none" id="successSection">
            <div class="success-card">
                <h2>Kayıt Başarıyla Tamamlandı! 🎉</h2>
                <p>Kayıt bilgilerinize ait QR kod aşağıdadır. Lütfen ekran görüntüsü alınız veya kaydediniz.</p>
                
                <div id="qr"></div>

                <div id="registrationInfo">
                    <p><strong>T.C. Kimlik:</strong> <span id="infoTC"></span></p>
                    <p><strong>Ad Soyad:</strong> <span id="infoAd"></span></p>
                    <p><strong>Telefon:</strong> <span id="infoTel"></span></p>
                    <p><strong>Okul / Sınıf:</strong> <span id="infoOkul"></span></p>
                    <p><strong>Kayıt Numarası:</strong> <span id="infoId"></span></p>
                </div>

                <div class="mt-4">
                    <button onclick="window.print()" class="btn btn-success">Yazdır / PDF İndir</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Gerekli Kütüphaneler ve Scriptler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
