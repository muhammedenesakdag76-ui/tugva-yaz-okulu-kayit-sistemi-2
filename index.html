<!-- Parça 1/8 -->

<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TÜGVA Yaz Okulu Kayıt</title>

<link
rel="stylesheet"
href="css/style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<script
src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js">
</script>

</head>

<body>

<div class="background"></div>

<div class="container">

<header class="hero">

<h1>

TÜGVA Yaz Okulu

</h1>

<p>

Online Kayıt Sistemi

</p>

</header>

<section class="capacity-card">

<h2>

Kalan Kontenjan

</h2>

<div
id="remainingCapacity"
class="capacity-value">

45

</div>

</section>

<section
id="formSection"
class="card">

<h2>

Kayıt Formu

</h2>

<form
id="registerForm">

<div class="grid">
<!-- index.html -->
<!-- Parça 2/8 -->

<div class="form-group">

<label>

Ad Soyad

</label>

<input

type="text"

id="adSoyad"

required>

</div>

<div class="form-group">

<label>

TC Kimlik No

</label>

<input

type="text"

id="tc"

maxlength="11"

required>

</div>

<div class="form-group">

<label>

Telefon

</label>

<input

type="text"

id="telefon"

maxlength="11"

required>

</div>

<div class="form-group">

<label>

E-Posta

</label>

<input

type="email"

id="email">

</div>

<div class="form-group">

<label>

Doğum Tarihi

</label>

<input

type="date"

id="dogumTarihi"

required>

</div>

<div class="form-group">

<label>

Cinsiyet

</label>

<select
id="cinsiyet"
required>

<option value="">

Seçiniz

</option>

<option>

Erkek

</option>

<option>

Kız

</option>

</select>

</div>
<!-- index.html -->
<!-- Parça 3/8 -->

<div class="form-group">

<label>

Okul

</label>

<input

type="text"

id="okul"

required>

</div>

<div class="form-group">

<label>

Sınıf

</label>

<input

type="text"

id="sinif"

required>

</div>

<div class="form-group">

<label>

Veli Adı

</label>

<input

type="text"

id="veliAdi"

required>

</div>

<div class="form-group">

<label>

Veli Telefon

</label>

<input

type="text"

id="veliTelefon"

maxlength="11"

required>

</div>
<!-- index.html -->
<!-- Parça 4/8 -->

<div class="form-group full">

<label>

Adres

</label>

<textarea

id="adres"

rows="4"

required>

</textarea>

</div>

<div class="form-group full">

<label>

Not

</label>

<textarea

id="note"

rows="3">

</textarea>

</div>
<!-- index.html -->
<!-- Parça 5/8 -->

<div class="checkbox-group full">

<label>

<input

type="checkbox"

id="kvkk"

required>

KVKK Aydınlatma Metnini Okudum.

</label>

</div>

<div class="checkbox-group full">

<label>

<input

type="checkbox"

id="parent"

required>

Veli Olarak Onaylıyorum.

</label>

</div>

<div class="form-group full">

<button

type="submit"

class="btn btn-primary">

Kaydı Tamamla

</button>

</div>

</div>

</form>

</section>
<!-- index.html -->
<!-- Parça 6/8 -->

<section

id="successCard"

class="card"

style="display:none;">

<h2>

Kayıt Başarılı

</h2>

<p>

Kayıt Numaranız

</p>

<h1 id="registerNumber">

</h1>

<div id="qrcode">

</div>
<!-- index.html -->
<!-- Parça 7/8 -->

<div class="button-group">

<button

id="downloadPdf"

class="btn btn-success"

type="button">

PDF İndir

</button>

<button

id="newRegister"

class="btn btn-secondary"

type="button">

Yeni Kayıt

</button>

</div>

</section>

<footer>

<p>

© 2026 TÜGVA Yaz Okulu

</p>

</footer>
<!-- index.html -->
<!-- Parça 8/8 (Son) -->

<script
type="module"
src="js/app.js">
</script>

</div>

</body>

</html>
