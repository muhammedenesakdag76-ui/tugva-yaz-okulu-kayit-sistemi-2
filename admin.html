<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TÜGVA Yaz Okulu Yönetim Paneli</title>

    <link rel="stylesheet"
          href="css/admin.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="admin-layout">
<aside class="sidebar">

    <div class="logo">

        <h2>TÜGVA</h2>

        <span>Yaz Okulu</span>

    </div>

    <nav>

        <button id="dashboardMenu">
            Dashboard
        </button>

        <button id="studentsMenu">
            Kayıtlar
        </button>

        <button id="scannerMenu">
            QR Okut
        </button>

        <button id="reportsMenu">
            Raporlar
        </button>

        <button id="settingsMenu">
            Ayarlar
        </button>

    </nav>

</aside>
<main class="content">

<header class="topbar">

<h1>

Yönetici Paneli

</h1>

<div>

<button

id="refreshButton"

class="btn btn-primary">

Yenile

</button>

</div>

</header>
<section class="stats">

<div class="stat-card">

<h3 id="statTotal">

0

</h3>

<p>

Toplam

</p>

</div>

<div class="stat-card">

<h3 id="statChecked">

0

</h3>

<p>

Giriş Yapan

</p>

</div>

<div class="stat-card">

<h3 id="statAbsent">

0

</h3>

<p>

Gelmeyen

</p>

</div>

<div class="stat-card">

<h3 id="statRemaining">

0

</h3>

<p>

Kalan Kontenjan

</p>

</div>

</section>
<section class="search-bar">

<input

type="text"

id="searchInput"

class="form-control"

placeholder="Ad, TC, Telefon, Okul, Koltuk..."

>

</section>
<section class="table-section">

<div class="table-responsive">

<table class="table table-striped table-hover align-middle">

<thead>

<tr>

<th>Kayıt No</th>

<th>Ad Soyad</th>

<th>Telefon</th>

<th>Okul</th>

<th>Sınıf</th>

<th>Koltuk</th>

<th>Durum</th>

<th>İşlemler</th>

</tr>

</thead>

<tbody id="registrationTable">

</tbody>

</table>

</div>

</section>
<section class="scanner-section">

<div class="scanner-card">

<h3>QR Kod Okut</h3>

<div id="qr-reader"></div>

<div id="qrResult"></div>

<div class="scanner-buttons">

<button
id="startScannerButton"
class="btn btn-success">

Kamerayı Aç

</button>

<button
id="stopScannerButton"
class="btn btn-danger">

Kamerayı Kapat

</button>

</div>

</div>

</section>
<section class="last-checkins">

<h3>

Son Okutulanlar

</h3>

<div id="lastCheckins">

<div class="empty">

Henüz okutma yapılmadı.

</div>

</div>

</section>
<div id="editModal" class="modal-custom">

<div class="modal-box">

<h2>

Kayıt Düzenle

</h2>

<input id="editName" class="form-control" placeholder="Ad Soyad">

<input id="editPhone" class="form-control" placeholder="Telefon">

<input id="editSchool" class="form-control" placeholder="Okul">

<input id="editClass" class="form-control" placeholder="Sınıf">

<input id="editParent" class="form-control" placeholder="Veli">

<input id="editParentPhone" class="form-control" placeholder="Veli Telefon">

<textarea
id="editAddress"
class="form-control"
placeholder="Adres"></textarea>

<textarea
id="editNote"
class="form-control"
placeholder="Not"></textarea>

<input id="editSeat"
class="form-control"
placeholder="Koltuk">

<div class="modal-actions">

<button
id="saveEditButton"
class="btn btn-success">

Kaydet

</button>

<button
id="closeEditButton"
class="btn btn-secondary">

Vazgeç

</button>

</div>

</div>

</div>
<div id="deleteModal" class="modal-custom">

<div class="modal-box">

<h2>

Kayıt Sil

</h2>

<p id="deleteMessage">

Bu kayıt silinecek.

</p>

<div class="modal-actions">

<button
id="confirmDeleteButton"
class="btn btn-danger">

Sil

</button>

<button
id="cancelDeleteButton"
class="btn btn-secondary">

İptal

</button>

</div>

</div>

</div>
<div
id="toastContainer"
class="toast-container position-fixed bottom-0 end-0 p-3">

</div>
<script
type="module"
src="js/admin.js"></script>

</main>

</div>

</body>

</html>
