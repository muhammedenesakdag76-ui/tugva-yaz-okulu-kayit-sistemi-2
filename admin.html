<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TÜGVA Yaz Okulu Yönetim Paneli</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/admin.css">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
</script>

<script
src="https://unpkg.com/html5-qrcode">
</script>

</head>

<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow">

<div class="container-fluid">

<span class="navbar-brand">

🎓 TÜGVA Yaz Okulu Yönetim Paneli

</span>

<div>

<span
id="clock"
class="text-white me-3">
</span>

<button
id="logout"
class="btn btn-outline-light">

Çıkış

</button>

</div>

</div>

</nav>
<div class="container mt-4">

<div class="row g-3">

<div class="col-md-3">

<div
id="capacityCard"
class="card shadow">

<div class="card-body">

<h6>Toplam Kayıt</h6>

<h2 id="totalStudent">

0

</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>Kalan Kontenjan</h6>

<h2 id="remainingStudent">

45

</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>Yoklama</h6>

<h2 id="checkedStudent">

0

</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card shadow">

<div class="card-body">

<h6>Doluluk</h6>

<h2 id="percentStudent">

0%

</h2>

</div>

</div>

</div>

</div>
<div class="card mt-4 shadow">

<div class="card-body">

<div class="row g-2">

<div class="col-md-4">

<input

id="search"

class="form-control"

placeholder="Ad, Telefon, TC veya Kayıt No">

</div>

<div class="col-md-8 text-end">

<button

id="exportExcel"

class="btn btn-success">

Excel

</button>

<button

id="printList"

class="btn btn-secondary">

Yazdır

</button>

<button

onclick="startQRScanner()"

class="btn btn-primary">

QR Kamera

</button>

</div>

</div>

</div>

</div>
<div class="card shadow mt-4">

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">
            Kayıtlı Öğrenciler
        </h5>

        <span class="badge bg-primary">
            Maksimum Kontenjan: 45
        </span>

    </div>

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-dark">

                    <tr>

                        <th>Kayıt No</th>

                        <th>Ad Soyad</th>

                        <th>Telefon</th>

                        <th>Veli</th>

                        <th>Durum</th>

                        <th>Koltuk</th>

                        <th width="220">
                            İşlemler
                        </th>

                    </tr>

                </thead>

                <tbody id="tableBody">

                    <tr>

                        <td colspan="7" class="text-center p-5">

                            Kayıt bekleniyor...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
<div class="card shadow mt-4">

    <div class="card-header">

        <h5 class="mb-0">

            QR Kod Okuyucu

        </h5>

    </div>

    <div class="card-body">

        <div
            id="qr-reader"
            style="
            max-width:420px;
            margin:auto;
            ">
        </div>

    </div>

</div>
<div
class="toast-container position-fixed bottom-0 end-0 p-3">

<div
id="toast"
class="toast border-0">

<div class="d-flex">

<div class="toast-body">

Mesaj

</div>

<button

class="btn-close btn-close-white me-2 m-auto"

data-bs-dismiss="toast">

</button>

</div>

</div>

</div>
<div
class="modal fade"
id="studentModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">

<h5>

Öğrenci Bilgileri

</h5>

<button

class="btn-close"

data-bs-dismiss="modal">

</button>

</div>

<div
id="studentDetail"
class="modal-body">

</div>

</div>

</div>

</div>
<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Admin -->

<script type="module" src="js/admin.js"></script>

</body>
</html>
