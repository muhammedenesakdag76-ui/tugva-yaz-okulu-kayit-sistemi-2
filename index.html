<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>TÜGVA Yaz Okulu Kayıt Sistemi</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="css/style.css">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>

</head>

<body>

<nav class="navbar navbar-dark bg-primary shadow">

<div class="container">

<span class="navbar-brand">

🎓 TÜGVA Yaz Okulu

</span>

</div>

</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">
<div class="card shadow-lg border-0">

<div class="card-body p-4">

<h2 class="text-center fw-bold">

Yaz Okulu Ön Kayıt Formu

</h2>

<p class="text-center text-muted">

Lütfen tüm bilgileri eksiksiz doldurunuz.

</p>
<div class="alert alert-primary mt-4">

<div
class="d-flex justify-content-between">

<strong>

Kontenjan

</strong>

<strong id="capacityText">

0 / 45

</strong>

</div>

<div
class="progress mt-2"
style="height:12px;">

<div

id="capacityBar"

class="progress-bar"

style="width:0%">

</div>

</div>

</div>
<div id="formSection">

<form id="registrationForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>

Ad Soyad

</label>

<input

name="name"

class="form-control"

required>

</div>

<div class="col-md-6 mb-3">

<label>

TC Kimlik No

</label>

<input

name="tc"

maxlength="11"

class="form-control"

required>

</div>

</div>
<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Telefon
        </label>

        <input
            type="tel"
            name="phone"
            class="form-control"
            placeholder="05XXXXXXXXX"
            maxlength="11"
            required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            E-Posta (İsteğe Bağlı)
        </label>

        <input
            type="email"
            name="email"
            class="form-control">

    </div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Doğum Tarihi
        </label>

        <input
            type="date"
            name="birth"
            class="form-control"
            required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Cinsiyet
        </label>

        <select
            name="gender"
            class="form-select"
            required>

            <option value="">
                Seçiniz
            </option>

            <option value="Erkek">
                Erkek
            </option>

            <option value="Kız">
                Kız
            </option>

        </select>

    </div>

</div>

<div class="row">

    <div class="col-md-8 mb-3">

        <label class="form-label">
            Okul
        </label>

        <input
            name="school"
            class="form-control"
            required>

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Sınıf
        </label>

        <select
            name="class"
            class="form-select"
            required>

            <option value="">Seçiniz</option>

            <option>1. Sınıf</option>
            <option>2. Sınıf</option>
            <option>3. Sınıf</option>
            <option>4. Sınıf</option>
            <option>5. Sınıf</option>
            <option>6. Sınıf</option>
            <option>7. Sınıf</option>
            <option>8. Sınıf</option>
            <option>9. Sınıf</option>
            <option>10. Sınıf</option>
            <option>11. Sınıf</option>
            <option>12. Sınıf</option>

        </select>

    </div>

</div>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Veli Adı Soyadı
        </label>

        <input
            name="parent"
            class="form-control"
            required>

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            Veli Telefonu
        </label>

        <input
            name="parentPhone"
            class="form-control"
            maxlength="11"
            placeholder="05XXXXXXXXX"
            required>

    </div>

</div>

<div class="mb-3">

    <label class="form-label">
        Adres
    </label>

    <textarea
        name="address"
        rows="3"
        class="form-control"
        required></textarea>

</div>

<div class="mb-4">

    <label class="form-label">
        Not (İsteğe Bağlı)
    </label>

    <textarea
        name="note"
        rows="2"
        class="form-control"></textarea>

</div>

<div class="d-grid">

    <button
        type="submit"
        class="btn btn-primary btn-lg">

        Kaydı Tamamla

    </button>

</div>

</form>

</div>
<!-- ======================================================
     BAŞARI EKRANI
====================================================== -->

<div
id="successSection"
class="d-none text-center py-4">

<div class="alert alert-success">

<h3 class="fw-bold">

🎉 Kayıt Başarıyla Tamamlandı

</h3>

<p>

Kayıt Numaranız

</p>

<h2
id="registerNumber"
class="text-primary fw-bold">

TYO-001

</h2>

</div>

<div
id="qrImage"
class="my-4 d-flex justify-content-center">

</div>

<p class="text-muted">

Etkinlik günü bu QR kodunu görevlilere göstermeniz yeterlidir.

</p>

<div class="d-grid gap-2">

<button
id="downloadPdf"
class="btn btn-success btn-lg">

📄 PDF Olarak İndir

</button>

<button
id="printRegistration"
class="btn btn-outline-secondary">

🖨 Yazdır

</button>

<button
id="newRegistration"
class="btn btn-primary">

➕ Yeni Kayıt Oluştur

</button>

</div>

</div>

</div>

</div>

</div>

</div>
<div
class="toast-container position-fixed bottom-0 end-0 p-3">

<div
id="toast"
class="toast border-0">

<div class="d-flex">

<div class="toast-body">

Mesaj

</div>

<button

type="button"

class="btn-close btn-close-white me-2 m-auto"

data-bs-dismiss="toast">

</button>

</div>

</div>

</div>
<footer class="text-center py-4 text-muted">

<small>

© 2026 TÜGVA SELÇUK Yaz Okulu Finali Kayıt Sistemi

</small>

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script></body>
<script src="https://unpkg.com/html5-qrcode"></script>

</html>
