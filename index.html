<!-- index.html içindeki formun hemen altına gelecek alan -->
<div id="successCard" class="card-result" style="display: none;">
    
    <!-- İndirmesi gerektiğini söyleyen uyarı kutusu -->
    <div class="alert-box warning">
        ⚠️ <strong>DİKKAT:</strong> Kaydınız başarıyla alındı! Lütfen aşağıdaki QR Kodunuzu içeren **PDF Belgenizi indirmeyi unutmayınız**. Girişlerde bu belgedeki QR Kod kontrol edilecektir.
    </div>

    <!-- PDF'e Dönüştürülecek Şık Alan -->
    <div id="pdfExportArea" class="pdf-card">
        <div class="pdf-header">
            <img src="assets/logo.png" alt="TÜGVA Logo" class="pdf-logo">
            <h2>TÜGVA İSTANBUL YAZ OKULU & GEZİSİ</h2>
            <p>Kayıt Onay Belgesi</p>
        </div>
        
        <div class="pdf-body">
            <div class="info-group">
                <p><strong>Kayıt ID:</strong> <span id="pdfDocId"></span></p>
                <p><strong>Ad Soyad:</strong> <span id="pdfName"></span></p>
                <p><strong>Telefon:</strong> <span id="pdfPhone"></span></p>
                <p><strong>T.C. No:</strong> <span id="pdfTc"></span></p>
            </div>
            
            <div class="qr-group">
                <div id="qrcodeCanvas"></div>
                <small>Giriş Kontrol QR Kodu</small>
            </div>
        </div>
    </div>

    <button id="downloadPdfBtn" class="btn-primary-lg">📄 PDF Olarak İndir</button>
</div>
