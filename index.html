<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TÜGVA Yaz Okulu Finali ve İstanbul Gezisi</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>TÜGVA</h1>

<h2>Yaz Okulu Finali ve İstanbul Gezisi</h2>

<p>Katılım Kayıt Sistemi</p>

</div>

</header>

<main class="container">

<section class="card">

<div class="remaining-box">

<h3>Kalan Kontenjan</h3>

<h1 id="remainingCount">40</h1>

</div>

</section>

<section
id="formCard"
class="card">

<h2>Katılımcı Bilgileri</h2>

<form
id="registerForm"
autocomplete="off">

<div class="form-group">

<label for="name">

Ad Soyad

</label>

<input
id="name"
type="text"
placeholder="Ad Soyad"
required>

</div>

<div class="form-group">

<label for="tc">

T.C. Kimlik No

</label>

<input
id="tc"
type="text"
maxlength="11"
inputmode="numeric"
placeholder="11 Haneli T.C."
required>

</div>

<div class="form-group">

<label for="birth">

Doğum Tarihi

</label>

<input
id="birth"
type="date"
required>

</div>

<div class="form-group">

<label for="phone">

Telefon

</label>

<input
id="phone"
type="tel"
placeholder="05XXXXXXXXX"
required>

</div>

<div class="form-group">

<label for="email">

E-Posta

</label>

<input
id="email"
type="email"
placeholder="ornek@mail.com">

</div>

<div class="form-group">

<label for="gender">

Cinsiyet

</label>

<select
id="gender"
required>

<option value="">

Seçiniz

</option>

<option value="Erkek">

Erkek

</option>

<option value="Kadın">

Kadın

</option>

</select>

</div>
<div class="form-group">

<label for="emergencyName">

Acil Durum Yakını

</label>

<input
id="emergencyName"
type="text"
placeholder="Ad Soyad"
required>

</div>

<div class="form-group">

<label for="emergencyPhone">

Acil Durum Telefonu

</label>

<input
id="emergencyPhone"
type="tel"
placeholder="05XXXXXXXXX"
required>

</div>

<div class="form-group">

<label for="note">

Not

</label>

<textarea
id="note"
rows="4"
placeholder="Varsa belirtmek istediğiniz sağlık bilgisi veya not yazabilirsiniz."></textarea>

</div>

<div class="checkbox">

<label>

<input
id="parent"
type="checkbox"
required>

Veli/Vasi onayını aldığımı kabul ediyorum.

</label>

</div>

<div class="checkbox">

<label>

<input
id="kvkk"
type="checkbox"
required>

KVKK kapsamında kişisel verilerimin işlenmesini kabul ediyorum.

</label>

</div>

<div class="button-area">

<button
type="submit"
class="btn">

Kayıt Ol

</button>

</div>

</form>

</section>

<section
id="successCard"
class="card hidden">

<h2>

🎉 Kayıt Başarıyla Tamamlandı

</h2>

<p>

Kayıt Numaranız

</p>

<h1
id="registerNumber">

TYG26-0001

</h1>

<div
id="qrcode"
style="display:flex;justify-content:center;margin:25px 0;">

</div>

<button
id="downloadCard"
class="btn">

📄 PDF Biletini İndir

</button>

<button
id="newRegister"
class="btn secondary">

➕ Yeni Kayıt

</button>

</section>
</main>

<footer class="footer">

<p>

© 2026 TÜGVA Yaz Okulu Finali ve İstanbul Gezisi

</p>

</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="module" src="js/app.js"></script>

</body>

</html>
