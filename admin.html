<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yönetim Paneli</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#f4f6f9;
}

.header{
    background:#0b8d42;
    color:#fff;
    padding:20px;
    text-align:center;
}

.wrapper{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    text-align:center;
}

.stat-card p{
    color:#666;
    margin-bottom:8px;
}

.stat-card h3{
    color:#0b8d42;
    font-size:34px;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.toolbar input{
    flex:1;
    min-width:250px;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
}

.toolbar button{
    padding:13px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:#fff;
    font-weight:bold;
}

#excelBtn{
    background:#198754;
}

#refreshBtn{
    background:#0d6efd;
}

#checkinPage{
    background:#fd7e14;
}

#logoutBtn{
    background:#dc3545;
}

.table-card{
    background:#fff;
    border-radius:15px;
    overflow:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}

th{
    background:#0b8d42;
    color:#fff;
    padding:14px;
    white-space:nowrap;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
    white-space:nowrap;
}

.checkBtn,
.cancelBtn,
.deleteBtn{
    border:none;
    border-radius:8px;
    padding:8px 12px;
    color:#fff;
    cursor:pointer;
    margin-right:5px;
}

.checkBtn{
    background:#198754;
}

.cancelBtn{
    background:#ffc107;
    color:#000;
}

.deleteBtn{
    background:#dc3545;
}

@media(max-width:768px){

.wrapper{
    width:100%;
}

.toolbar{
    flex-direction:column;
}

.toolbar button{
    width:100%;
}

}

</style>

</head>

<body>

<header class="header">

<h1>TÜGVA Yaz Okulu Yönetim Paneli</h1>

</header>

<div class="wrapper">

<div class="stats">

<div class="stat-card">

<p>Toplam Kayıt</p>

<h3 id="totalCount">0</h3>

</div>

<div class="stat-card">

<p>Check-in</p>

<h3 id="checkedCount">0</h3>

</div>

<div class="stat-card">

<p>Bekleyen</p>

<h3 id="waitingCount">0</h3>

</div>

<div class="stat-card">

<p>Kalan Kontenjan</p>

<h3 id="remainingAdmin">85</h3>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="🔍 Ad Soyad, Telefon, T.C. veya Kayıt No Ara...">

<button id="excelBtn">
Excel
</button>

<button id="refreshBtn">
Yenile
</button>

<button id="checkinPage">
QR Okuyucu
</button>

<button id="logoutBtn">
Çıkış
</button>

</div>

<div class="table-card">

<table>

<thead>

<tr>

<th>Kayıt No</th>

<th>Ad Soyad</th>

<th>T.C.</th>

<th>Telefon</th>

<th>Doğum</th>

<th>Cinsiyet</th>

<th>Acil Durum</th>

<th>Check-in</th>

<th>İşlem</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<script type="module" src="js/admin.js"></script>

</body>

</html>
