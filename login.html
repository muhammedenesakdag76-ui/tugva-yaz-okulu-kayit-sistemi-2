<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yönetici Girişi</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.login-card h1{
    text-align:center;
    margin-bottom:8px;
    color:#0b8d42;
}

.login-card p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.login-card input:focus{
    outline:none;
    border-color:#0b8d42;
    box-shadow:0 0 0 3px rgba(11,141,66,.15);
}

.login-card button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0b8d42;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.login-card button:hover{
    background:#087634;
}

#error{
    display:none;
    margin-top:15px;
    color:#d32f2f;
    text-align:center;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-card">

<h1>Yönetici Girişi</h1>

<p>TÜGVA Yaz Okulu Kayıt Sistemi</p>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="E-posta"
required>

<input
type="password"
id="password"
placeholder="Şifre"
required>

<button type="submit">

Giriş Yap

</button>

</form>

<div id="error"></div>

</div>

<script type="module" src="js/login.js"></script>

</body>

</html>
