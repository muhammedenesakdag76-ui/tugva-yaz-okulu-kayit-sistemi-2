<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Yönetici Girişi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="css/admin.css">

</head>

<body class="bg-light">

<div class="container">

<div class="row justify-content-center align-items-center"
     style="min-height:100vh;">

<div class="col-lg-4">

<div class="card shadow">

<div class="card-body p-4">

<h3 class="text-center mb-4">

Yönetici Girişi

</h3>

<div class="mb-3">

<label class="form-label">

E-posta

</label>

<input
    id="email"
    type="email"
    class="form-control">

</div>

<div class="mb-3">

<label class="form-label">

Şifre

</label>

<input
    id="password"
    type="password"
    class="form-control">

</div>

<div
    id="loginError"
    class="alert alert-danger d-none">

</div>

<button
    id="loginButton"
    class="btn btn-primary w-100">

Giriş Yap

</button>

</div>

</div>

</div>

</div>

</div>

<script type="module"
        src="js/login.js"></script>

</body>

</html>
