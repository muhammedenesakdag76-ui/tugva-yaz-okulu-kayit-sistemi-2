<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Yönetici Girişi</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

    background:linear-gradient(
        135deg,
        #0d6efd,
        #084298
    );

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:"Segoe UI",sans-serif;

}

.login-card{

    width:100%;
    max-width:430px;

    border:none;

    border-radius:18px;

    box-shadow:0 15px 40px rgba(0,0,0,.2);

}

.logo{

    font-size:60px;

}

.form-control{

    min-height:52px;

    border-radius:12px;

}

.btn{

    min-height:52px;

    border-radius:12px;

}

</style>

</head>

<body>

<div class="card login-card">

<div class="card-body p-4">

<div class="text-center">

<div class="logo">

🎓

</div>

<h3>

TÜGVA Yönetici Girişi

</h3>

<p class="text-muted">

Lütfen giriş yapınız.

</p>

</div>
<form id="loginForm">

<div class="mb-3">

<label>

E-Posta

</label>

<input

type="email"

id="email"

class="form-control"

required>

</div>

<div class="mb-3">

<label>

Şifre

</label>

<div class="input-group">

<input

type="password"

id="password"

class="form-control"

required>

<button

type="button"

id="togglePassword"

class="btn btn-outline-secondary">

👁

</button>

</div>

</div>

<div class="d-grid">

<button

id="loginButton"

class="btn btn-primary">

Giriş Yap

</button>

</div>

</form>
<div
class="toast-container position-fixed bottom-0 end-0 p-3">

<div
id="toast"
class="toast">

<div class="d-flex">

<div class="toast-body">

Mesaj

</div>

<button

class="btn-close me-2 m-auto"

data-bs-dismiss="toast">

</button>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/login.js"></script>

</div>

</div>

</body>

</html>
