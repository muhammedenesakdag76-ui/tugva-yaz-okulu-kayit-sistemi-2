<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Yönetici Paneli</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="hero">

<div class="overlay"></div>

<div class="hero-content">

<h1>TÜGVA</h1>

<h2>Yönetici Paneli</h2>

<p>Yaz Okulu Kayıt Sistemi</p>

</div>

</header>

<main class="container">

<section class="stats">

<div class="stat-card">

<p>👥 Toplam Kayıt</p>

<h3 id="totalCount">0</h3>

</div>

<div class="stat-card">

<p>✅ Check-in</p>

<h3 id="checkedCount">0</h3>

</div>

<div class="stat-card">

<p>⏳ Bekleyen</p>

<h3 id="waitingCount">0</h3>

</div>

<div class="stat-card">

<p>🎟️ Kalan Kontenjan</p>

<h3 id="remainingAdmin">85</h3>

</div>

</section>

<section class="card">

<div class="toolbar">

<input
id="searchInput"
type="text"
placeholder="🔍 Ad, T.C., Telefon veya Kayıt No Ara">

<button
class="btn"
id="excelBtn">

📥 Excel

</button>

<button
class="btn"
id="refreshBtn">

🔄 Yenile

</button>

<button
class="btn"
id="checkinPage">

📷 QR Check-in

</button>

<button
class="btn secondary"
id="logoutBtn">

🚪 Çıkış Yap

</button>

</div>

<div style="overflow:auto;">

<table>

<thead>

<tr>

<th>#</th>

<th>Kayıt No</th>

<th>Ad Soyad</th>

<th>T.C.</th>

<th>Telefon</th>

<th>Cinsiyet</th>

<th>Durum</th>

<th>İşlem</th>

</tr>

</thead>

<tbody id="tableBody">

<tr>

<td colspan="8" style="text-align:center;padding:30px;">

Yükleniyor...

</td>

</tr>

</tbody>

</table>

</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module" src="js/admin.js"></script>

</body>

</html>
